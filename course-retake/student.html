<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>國立頭城家商 — 重補修網路申請系統</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght=500&display=swap" rel="stylesheet">

<style>
*{font-family: 'Noto Sans TC', sans-serif;}
.header{
  color:AntiqueWhite;
  background-color:LightSeaGreen;
  padding: 10px;
}
.work-zone {
  margin-top: 20px;
  padding: 15px;
  border: 1px dashed #ccc;
  background-color: #f9f9f9;
  border-radius: 5px;
}
.row-registered {
  background-color: #ffff00 !important;
  color: #ff0000 !important;
}
#loading-overlay {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(255, 255, 255, 0.8);
  z-index: 9999;
  display: flex;
  justify-content: center;
  align-items: center;
}
</style>
</head>

<body>

  <!-- 全畫面處理中遮罩 -->
  <div id="loading-overlay" class="d-none">
    <div class="text-center">
      <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
      <div class="mt-2 fw-bold text-secondary">系統處理中，請稍候...</div>
    </div>
  </div>

<div class="container-fluid">
  
  <div class="header">
    <h4>國立頭城高級家事商業職業學校<BR>115學年度第1學期<BR>重補修網路申請系統</h4>
    <div style="text-align: right;">系統維護：教務處實驗研究組<BR>校內分機111或E-mail：tcvschss@tcvs.ilc.edu.tw</div>
  </div>
  
  <!-- 錯誤/提示訊息區 -->
  <div id="no-data-msg" class="alert alert-warning d-none fw-bold text-center my-3"></div>

  <!-- 1. 學生身分驗證區 -->
  <div name="loginarea" class="work-zone">
    <h5>🔑 學生身分驗證</h5>
    <form id="login-form" onsubmit="event.preventDefault(); fetchStudentData();" class="mt-3">
      <div class="row g-3 align-items-center">
        <div class="col-md-4">
          <label for="student-id" class="form-label fw-bold">學號</label>
          <input type="text" class="form-control" id="student-id" placeholder="例如: 112001" required>
        </div>
        <div class="col-md-5">
          <label for="id-card-4" class="form-label fw-bold">身分證字號（後四碼）</label>
          <input type="password" class="form-control" id="id-card-4" maxlength="4" placeholder="請輸入後 4 碼數字" required>
        </div>
        <div class="col-md-3 pt-md-4">
          <button type="submit" id="btnQuery" class="btn btn-primary w-100 fw-bold">查詢重補修科目</button>
        </div>
      </div>
    </form>
  </div>

  <!-- 2. 學生基本資料區 -->
  <div id="student-info-block" class="work-zone d-none">
    <h5>👤 學生基本資料</h5>
    <div class="row g-3 text-dark mt-2 ps-1">
      <div class="col-6 col-sm-3"><strong>學號：</strong><span id="info-id">-</span></div>
      <div class="col-6 col-sm-3"><strong>班級：</strong><span id="info-class">-</span></div>
      <div class="col-6 col-sm-3"><strong>座號：</strong><span id="info-seat">-</span></div>
      <div class="col-6 col-sm-3"><strong>姓名：</strong><span id="info-name">-</span></div>
    </div>
  </div>

  <!-- 3. 可重補修科目表 -->
  <div id="course-table-block" class="work-zone d-none">
    <div class="d-flex justify-content-between align-items-center flex-wrap g-2">
      <h5 class="m-0">📚 可重補修科目清單</h5>
      <span class="badge bg-secondary p-2">提示：勾選即可加選，取消勾選即為退選</span>
    </div>

    <div class="table-responsive mt-3 bg-white p-3 border rounded">
      <table class="table table-bordered align-middle m-0" id="course-table">
        <thead class="table-light text-secondary">
          <tr>
            <th style="width: 70px;" class="text-center">選取</th>
            <th>年級/學期</th>
            <th>科目名稱</th>
            <th style="width: 80px;" class="text-center">學分</th>
            <th>科目狀態</th>
            <th style="width: 140px;" class="text-center">目前申請狀況</th>
          </tr>
        </thead>
        <tbody id="course-tbody">
          <!-- 系統動態生成 -->
        </tbody>
      </table>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-4 border-top pt-3 flex-wrap g-2">
      <div class="text-secondary small fw-bold">
        ※ 送出異動後，系統會自動同步至申請名冊，並發送明細信至您的信箱。
      </div>
      <button type="button" id="btnSubmit" class="btn btn-success px-4 fw-bold shadow-sm" onclick="submitRegData()">
        💾 確認並送出異動登記
      </button>
    </div>
  </div>

</div>

<script>
  // 🌟 固定您的 Web 應用程式網址，採用 text/plain 繞過 CORS 機制，穩定度最高
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz1viSsMr-yLhx146zzonHCKl4Qdp-YD6c98GcZpTqgh_6zpSixejNuQHnZMfmMq6R0Sw/exec";

  let globalStudentInfo = null;
  let globalOriginalCourses = [];

  function toggleLoading(show) {
    const overlay = document.getElementById("loading-overlay");
    if (show) overlay.classList.remove("d-none");
    else overlay.classList.add("d-none");
  }

  function fetchStudentData() {
    const studentId = document.getElementById("student-id").value.trim();
    const idCard4 = document.getElementById("id-card-4").value.trim();
    const msgDiv = document.getElementById("no-data-msg");
    const btnQuery = document.getElementById("btnQuery");

    if (!studentId || !idCard4) return;

    msgDiv.classList.add("d-none");
    document.getElementById("student-info-block").classList.add("d-none");
    document.getElementById("course-table-block").classList.add("d-none");

    btnQuery.disabled = true;
    toggleLoading(true);

    fetch(WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "getStudentData",
        studentId: studentId,
        idCard4: idCard4
      }),
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      }
    })
    .then(response => {
      if (!response.ok) throw new Error("網路連線回應異常");
      return response.json();
    })
    .then(data => {
      toggleLoading(false);
      btnQuery.disabled = false;
      
      if (data.success) {
        if (data.isEmpty) {
          msgDiv.innerText = "沒有可重補修的科目。";
          msgDiv.className = "alert alert-warning fw-bold text-center my-3";
          msgDiv.classList.remove("d-none");
          return;
        }

        globalStudentInfo = data.studentInfo;
        globalOriginalCourses = data.courseList;

        document.getElementById("info-class").innerText = data.studentInfo.className;
        document.getElementById("info-seat").innerText = data.studentInfo.seatNo;
        document.getElementById("info-name").innerText = data.studentInfo.name;
        document.getElementById("info-id").innerText = data.studentInfo.id;
        document.getElementById("student-info-block").classList.remove("d-none");

        renderCourseTable(data.courseList);
        document.getElementById("course-table-block").classList.remove("d-none");
      } else {
        msgDiv.innerText = data.msg;
        msgDiv.className = "alert alert-danger fw-bold text-center my-3";
        msgDiv.classList.remove("d-none");
      }
    })
    .catch(err => {
      toggleLoading(false);
      btnQuery.disabled = false;
      msgDiv.innerText = "系統連線錯誤：" + err.message + "，請稍後再試或洽實驗研究組（電子郵件：tcvschss@tcvs.ilc.edu.tw）。";
      msgDiv.className = "alert alert-danger fw-bold text-center my-3";
      msgDiv.classList.remove("d-none");
      console.error(err);
    });
  }

  function renderCourseTable(courses) {
    const tbody = document.getElementById("course-tbody");
    tbody.innerHTML = "";

    courses.forEach((course, index) => {
      const tr = document.createElement("tr");
      const isRegistered = course.reg === "已登記";
      if (isRegistered) {
        tr.className = "row-registered";
      }

      const checkedAttr = isRegistered ? "checked" : "";

      let statusDisplayHtml = "";
      const checkGet = String(course.get).trim();
      const mainStatus = String(course.status).trim(); 

      if (checkGet === "是-Y") {
        statusDisplayHtml = `
          <span class="badge bg-secondary status-badge me-2">重修</span>
          <span class="text-danger fw-bold small">已取得學分</span>
        `;
      } else {
        statusDisplayHtml = `<span class="badge bg-secondary status-badge">${mainStatus}</span>`;
      }

      tr.innerHTML = `
        <td class="text-center">
          <input type="checkbox" class="form-check-input course-checkbox" 
                 data-index="${index}" ${checkedAttr} style="transform: scale(1.2); cursor: pointer;">
        </td>
        <td>${course.grade} / ${course.semester}學期</td>
        <td class="fw-bold">${course.subject}</td>
        <td class="text-center">${course.credit}</td>
        <td>
          ${statusDisplayHtml}
        </td>
        <td class="text-center fw-bold text-nowrap" id="status-text-${index}">
          ${isRegistered ? "★ 已登記申請" : "—"}
        </td>
      `;
      tbody.appendChild(tr);
    });

    document.querySelectorAll(".course-checkbox").forEach(chk => {
      chk.addEventListener("change", function() {
        const idx = this.getAttribute("data-index");
        const targetTr = this.closest("tr");
        const statusTd = document.getElementById(`status-text-${idx}`);
        const originalReg = courses[idx].reg === "已登記";

        if (this.checked) {
          targetTr.classList.add("row-registered");
          statusTd.innerText = originalReg ? "★ 已登記申請" : "＋ 本次待加選";
        } else {
          targetTr.classList.remove("row-registered");
          statusTd.innerText = originalReg ? "－ 本次待退選" : "—";
        }
      });
    });
  }

  function submitRegData() {
    if (!globalStudentInfo || globalOriginalCourses.length === 0) return;

    let addedCourses = [];
    let removedCourses = [];
    let currentTotalSelected = 0;

    const checkboxes = document.querySelectorAll(".course-checkbox");
    checkboxes.forEach(chk => {
      const idx = parseInt(chk.getAttribute("data-index"), 10);
      const course = globalOriginalCourses[idx];
      const isOriginallyChecked = course.reg === "已登記";
      const isCurrentlyChecked = chk.checked;

      if (isCurrentlyChecked) {
        currentTotalSelected++;
      }

      if (isCurrentlyChecked && !isOriginallyChecked) {
        addedCourses.push(course);
      } else if (!isCurrentlyChecked && isOriginallyChecked) {
        removedCourses.push(course);
      }
    });

    if (addedCourses.length === 0 && removedCourses.length === 0) {
      alert("您目前的勾選狀態，未有任何異動，無須提交。");
      return;
    }

    const confirmRun = confirm(`您目前共選取了 ${currentTotalSelected} 個科目。\n確認要提交本次的「加選/退選」異動嗎？`);
    if (!confirmRun) return;

    const btnSubmit = document.getElementById("btnSubmit");
    btnSubmit.disabled = true;
    toggleLoading(true);

    fetch(WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "submitRegistration",
        studentInfo: globalStudentInfo,
        addedCourses: addedCourses,
        removedCourses: removedCourses
      }),
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      }
    })
    .then(response => {
      if (!response.ok) throw new Error("網路連線回應異常");
      return response.json();
    })
    .then(res => {
      toggleLoading(false);
      btnSubmit.disabled = false;
      if (res.success) {
        // 💡 調整提示：告知異動明細已發送至學生的學校信箱
        alert("異動更新成功！異動明細已同步發送至您的學校信箱。");
        fetchStudentData(); 
      } else {
        alert("更新失敗：" + res.msg + "\n請洽教務處實驗研究組（電子郵件：tcvschss@tcvs.ilc.edu.tw）。");
      }
    })
    .catch(err => {
      toggleLoading(false);
      btnSubmit.disabled = false;
      alert("提交時發生連線錯誤：" + err.message + "\n請檢查網路連接，或洽教務處實驗研究組。");
      console.error(err);
    });
  }
</script>
</body>
</html>
