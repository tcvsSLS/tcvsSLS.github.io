<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>國立頭城家商 — 重補修網路申請系統</title>
  
  <!-- CDN 資源 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght=500&display=swap" rel="stylesheet">

  <!-- 引用專案共用 CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- 全畫面處理中遮罩 -->
  <div id="loading-overlay" class="d-none">
    <div class="text-center">
      <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
      <div class="mt-2 fw-bold text-secondary">系統處理中，請稍候...</div>
    </div>
  </div>

<div class="container-fluid">
  
  <!-- 頁首資訊 -->
  <div class="header">
    <h4>國立頭城高級家事商業職業學校<br>115學年度第1學期<br>重補修網路申請系統</h4>
    <div style="text-align: right;">系統維護：教務處實驗研究組<br>校內分機111或E-mail：tcvschss@tcvs.ilc.edu.tw</div>
  </div>
  
  <!-- 錯誤/提示訊息區 -->
  <div id="no-data-msg" class="alert alert-warning d-none fw-bold text-center my-3"></div>

  <!-- 1. 學生身分驗證區 -->
  <div name="loginarea" class="work-zone">
    <h5>🔑 學生身分驗證</h5>
    <form id="login-form" onsubmit="event.preventDefault(); fetchStudentData();" class="mt-3">
      <div class="row g-3 align-items-center">
        <div class="col-md-4">
          <label for="student-id" class="form-label fw-bold">學號</label>
          <input type="text" class="form-control" id="student-id" placeholder="例如: 112001" required>
        </div>
        <div class="col-md-5">
          <label for="id-card-4" class="form-label fw-bold">身分證字號（後四碼）</label>
          <input type="password" class="form-control" id="id-card-4" maxlength="4" placeholder="請輸入後 4 碼數字" required>
        </div>
        <div class="col-md-3 pt-md-4">
          <button type="submit" id="btnQuery" class="btn btn-primary w-100 fw-bold">查詢重補修科目</button>
        </div>
      </div>
    </form>
  </div>

  <!-- 2. 學生基本資料區 -->
  <div id="student-info-block" class="work-zone d-none">
    <h5>👤 學生基本資料</h5>
    <div class="row g-3 text-dark mt-2 ps-1">
      <div class="col-6 col-sm-3"><strong>學號：</strong><span id="info-id">-</span></div>
      <div class="col-6 col-sm-3"><strong>姓名：</strong><span id="info-name">-</span></div>
      <div class="col-6 col-sm-3"><strong>班級：</strong><span id="info-class">-</span></div>
      <div class="col-6 col-sm-3"><strong>座號：</strong><span id="info-seat">-</span></div>
    </div>
  </div>

  <!-- 3. 可重補修科目表 -->
  <div id="course-table-block" class="work-zone d-none">
    <div class="d-flex justify-content-between align-items-center flex-wrap g-2">
      <h5 class="m-0">📚 可重補修科目清單</h5>
      <span class="badge bg-secondary p-2">提示：勾選即可加選，取消勾選即為退選</span>
    </div>

    <div class="table-responsive mt-3 bg-white p-3 border rounded">
      <table class="table table-bordered align-middle m-0" id="course-table">
        <thead class="table-light text-secondary">
          <tr>
            <th style="width: 70px;" class="text-center">選取</th>
            <th>年級/學期</th>
            <th>科目名稱</th>
            <th style="width: 80px;" class="text-center">學分</th>
            <th>科目狀態</th>
            <th style="width: 140px;" class="text-center">目前申請狀況</th>
          </tr>
        </thead>
        <tbody id="course-tbody">
          <!-- 系統動態生成 -->
        </tbody>
      </table>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-4 border-top pt-3 flex-wrap g-2">
      <div class="text-secondary small fw-bold">
        ※ 送出異動後，系統會自動同步至申請名冊，並發送明細信至您的信箱。
      </div>
      <button type="button" id="btnSubmit" class="btn btn-success px-4 fw-bold shadow-sm" onclick="submitRegData()">
        💾 確認並送出異動登記
      </button>
    </div>
  </div>

</div>

<!-- 腳本引入 -->
<script src="js/config.js"></script>
<script src="js/student.js"></script>

</body>
</html>
