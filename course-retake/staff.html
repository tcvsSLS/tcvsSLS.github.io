<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>國立頭城家商 — 重補修管理系統</title>
  
  <!-- CDN 資源 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght=500&display=swap" rel="stylesheet">

  <!-- 獨立 CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container-fluid">
  <!-- 頁首資訊 -->
  <div class="header">
    <h4>國立頭城高級家事商業職業學校<br>115學年度第1學期<br>重補修管理系統</h4>
    <div style="text-align: right;">系統維護：只能自己來了</div>
  </div>
  
  <!-- 頂部功能按鈕區 -->
  <div name="workarea" class="work-zone">
    <button id="btnConvert" class="btn btn-primary" onclick="handleConvert()">建立可選修資料表</button>
    <button id="btnConsolidate" class="btn btn-primary" onclick="handleConsolidate()">整合申請資料</button>
    <button id="btnCourse" class="btn btn-primary" onclick="handleCourseClick()">開課</button>
    <button id="btnSchedule" class="btn btn-primary" onclick="handleScheduleClick()">排課</button>
    
    <!-- 檔案上傳區塊 -->
    <div id="uploadArea" class="upload-box" style="display: none;">
      <h6 class="text-warning-emphasis fw-bold">請先上傳原始檔案：</h6>
      <div class="input-group my-2">
        <input type="file" class="form-control" id="excelFileSelector" accept=".xlsx">
        <button class="btn btn-warning" type="button" id="btnUpload" onclick="handleUpload()">上傳檔案</button>
      </div>
      <small class="text-muted">※ 註：無論您選擇的檔名為何，系統皆會自動將其存為「班級明細表.xlsx」。</small>
    </div>

    <div id="statusMessage" class="mt-3 text-muted" style="display:none;"></div>
  </div>

  <!-- 🌟 動態組件掛載點 (Component Mount Points) -->
  <div id="courseZoneContainer"></div>
  <div id="scheduleZoneContainer"></div>

</div>

<!-- 腳本引入（必須注意引入順序） -->
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/course.js"></script>
<script src="js/schedule.js"></script>

</body>
</html>
